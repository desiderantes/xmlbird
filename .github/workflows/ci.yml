name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac \
            libglib2.0-dev \
            git \
            gcc \
            make \
            wget \
            python3-pip \
            afl++
          pip3 install --break-system-packages --upgrade meson ninja
          meson --version
          ninja --version

      - name: Setup Meson
        run: meson setup build -Dfuzzing=true -Dwarning_level=2

      - name: Compile
        run: meson compile -C build

      - name: Run Tests (Unit & Fuzz)
        run: meson test -C build --verbose

      - name: Run Benchmarks
        run: meson test -C build --benchmark --verbose

      - name: Verify Install
        run: meson install -C build --destdir /tmp/install-dest

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && !env.ACT
        with:
          files: build/meson-logs/testlog.junit.xml

  fuzz:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valac \
            libglib2.0-dev \
            git \
            gcc \
            make \
            python3-pip \
            afl++
          pip3 install --break-system-packages --upgrade meson ninja

      - name: Setup Meson (AFL++)
        run: CC=afl-clang-fast meson setup build -Dfuzzing=true -Dfuzz_duration=60 -Dwarning_level=2

      - name: Compile
        run: meson compile -C build

      - name: Run Seed Tests
        run: meson test -C build --suite fuzz --verbose

      - name: Run AFL++ Fuzzing (60s)
        env:
          AFL_NO_UI: "1"
        run: |
          ninja -C build fuzz
          if [ -f build/fuzzing/fuzz_out/default/fuzzer_stats ]; then
            cat build/fuzzing/fuzz_out/default/fuzzer_stats
          fi
          for f in build/fuzzing/fuzz_out/default/crashes/id:* build/fuzzing/fuzz_out/default/hangs/id:*; do
            if [ -e "$f" ]; then
              echo "Fuzzing found crashes or hangs in build/fuzzing/fuzz_out/default/" >&2
              exit 1
            fi
          done

      - name: Archive Fuzz Output
        if: always() && !env.ACT
        run: |
          if [ -d build/fuzzing/fuzz_out ]; then
            tar -C build/fuzzing -czf build/afl-fuzz-output.tar.gz fuzz_out
          fi

      - name: Upload Fuzz Output
        uses: actions/upload-artifact@v4
        if: always() && !env.ACT
        with:
          name: afl-fuzz-output
          path: build/afl-fuzz-output.tar.gz
          if-no-files-found: ignore
          retention-days: 14
